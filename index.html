<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简报阅读器 (CSV版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        /* --- 1. 核心样式 (源自 index4) --- */
        :root {
            --sidebar-width: 300px;
            --primary-color: #2c3e50;  /* 深蓝背景 */
            --accent-color: #1abc9c;   /* 青绿高亮 */
            --text-color: #333;
            --bg-color: #f4f4f9;
            --header-bg: #34495e;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.8;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 2. 上传区域 (功能保留，样式升级) --- */
        #upload-zone {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .upload-box {
            border: 3px dashed #bdc3c7;
            padding: 60px;
            border-radius: 12px;
            text-align: center;
            background: white;
            transition: all 0.3s;
            cursor: pointer;
            width: 80%;
            max-width: 500px;
            box-shadow: var(--card-shadow);
        }

        .upload-box:hover, .upload-box.dragover {
            border-color: var(--accent-color);
            background: #fdfdfd;
            transform: scale(1.02);
        }

        .upload-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        
        .upload-btn:hover {
            background: #16a085;
        }
        
        #file-input { display: none; }

        /* --- 3. 界面布局 (应用 index4 样式) --- */
        #app-container {
            display: none; /* 数据加载后显示 */
            width: 100%;
            height: 100%;
            display: flex; /* 确保 flex 布局生效 */
        }
        
        /* 初始隐藏 app-container，通过 JS 控制 display */
        body:not(.loaded) #app-container {
            display: none;
        }
        body.loaded #app-container {
            display: flex;
        }

        /* 侧边栏 */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--primary-color);
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            flex-shrink: 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .sidebar-header {
            padding: 25px 20px;
            background-color: var(--header-bg);
            font-weight: bold;
            font-size: 1.2em;
            border-bottom: 1px solid #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .sidebar-header svg {
            width: 24px;
            height: 24px;
            fill: var(--accent-color);
        }

        /* 导航列表 */
        .nav-links {
            flex-grow: 1;
            overflow-y: auto;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-links::-webkit-scrollbar {
            width: 6px;
        }
        .nav-links::-webkit-scrollbar-thumb {
            background-color: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        .nav-item {
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .nav-item a {
            display: block;
            padding: 15px 20px;
            color: #bdc3c7;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.95em;
            border-left: 4px solid transparent;
            /* 文本截断 */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-item a:hover, .nav-item a.active {
            background-color: #34495e;
            color: white;
            border-left-color: var(--accent-color);
        }

        /* 侧边栏底部：分页控制区 (适配深色主题) */
        .pagination-bar {
            padding: 15px;
            background-color: var(--header-bg);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .page-btn {
            padding: 6px 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #ecf0f1;
            transition: all 0.2s;
        }
        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }
        .page-btn:hover:not(:disabled) {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        .page-info {
            font-size: 12px;
            color: #bdc3c7;
        }

        /* 主内容区域 */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 40px;
            scroll-behavior: smooth;
            position: relative;
        }

        /* 文章卡片 (完全复用 index4 样式) */
        .article-wrapper {
            max-width: 850px;
            margin: 0 auto 60px auto;
            background: white;
            padding: 60px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s;
        }
        
        .article-wrapper:hover {
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
        }

        .article-title {
            font-size: 2.2em;
            margin-bottom: 15px;
            color: var(--primary-color);
            line-height: 1.3;
            border-left: 5px solid var(--accent-color);
            padding-left: 20px;
            margin-top: 0;
        }

        .article-meta {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 20px;
        }

        .article-body {
            font-size: 1.1em;
            text-align: justify;
            color: #2c3e50;
            white-space: pre-wrap; /* 保留换行 */
        }

        .article-body p { margin-bottom: 1.8em; }

        /* 返回顶部按钮 */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--accent-color);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            opacity: 0.8;
            transition: opacity 0.3s, transform 0.3s;
            text-decoration: none;
            z-index: 200;
        }
        .back-to-top:hover {
            opacity: 1;
            transform: translateY(-3px);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; overflow: auto; }
            .sidebar { width: 100%; height: auto; max-height: 50vh; }
            .main-content { padding: 20px; }
            .article-wrapper { padding: 25px; margin-bottom: 30px; }
            .article-title { font-size: 1.6em; padding-left: 15px; }
            /* 移动端隐藏上传区背景，避免覆盖 */
            #upload-zone { position: fixed; height: 100vh; }
        }
    </style>
</head>
<body>

    <div id="upload-zone">
        <div class="upload-box" id="drop-area">
            <div style="font-size: 48px; margin-bottom: 10px;">📊</div>
            <h2 style="margin: 0; color: var(--primary-color);">加载行业简报</h2>
            <p style="color: #7f8c8d;">请将 <strong>rss.csv</strong> 文件拖入此处</p>
            <button class="upload-btn" onclick="document.getElementById('file-input').click()">选择文件</button>
            <input type="file" id="file-input" accept=".csv">
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                简报目录
            </div>
            
            <ul class="nav-links" id="nav-list">
                </ul>

            <div class="pagination-bar">
                <button class="page-btn" id="btn-prev" onclick="changePage(-1)">上一页</button>
                <span class="page-info" id="page-info">1 / 1</span>
                <button class="page-btn" id="btn-next" onclick="changePage(1)">下一页</button>
            </div>
        </div>

        <div class="main-content" id="main-content">
            <div id="articles-wrapper">
                </div>
            
            <a href="#" class="back-to-top" title="返回顶部" onclick="scrollToTop(event)">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
            </a>
        </div>
    </div>

<script>
    // --- 全局变量 ---
    let allArticles = [];    
    let currentPage = 1;     
    const PAGE_SIZE = 10;    // 调整为每页显示10篇，体验更好

    const dropArea = document.getElementById('drop-area');
    const fileInput = document.getElementById('file-input');
    const uploadZone = document.getElementById('upload-zone');
    const body = document.body;

    // --- 拖拽事件处理 ---
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
    });
    ['dragenter', 'dragover'].forEach(name => dropArea.addEventListener(name, () => dropArea.classList.add('dragover'), false));
    ['dragleave', 'drop'].forEach(name => dropArea.addEventListener(name, () => dropArea.classList.remove('dragover'), false));

    dropArea.addEventListener('drop', e => handleFiles(e.dataTransfer.files), false);
    fileInput.addEventListener('change', e => handleFiles(e.target.files), false);

    function handleFiles(files) {
        if (files.length > 0) parseCSV(files[0]);
    }

    // --- CSV 解析逻辑 ---
    function parseCSV(file) {
        Papa.parse(file, {
            complete: function(results) {
                const rawData = results.data;
                // 数据清洗
                const cleanData = rawData.filter(row => row.length >= 3 && row[0] !== '');
                
                // 去除表头
                let startIndex = 0;
                if (cleanData.length > 0 && (cleanData[0][0].includes('标题') || cleanData[0][0].includes('Title'))) {
                    startIndex = 1;
                }

                allArticles = cleanData.slice(startIndex);

                if (allArticles.length === 0) {
                    alert("未读取到有效数据");
                    return;
                }

                // 初始化界面
                currentPage = 1;
                renderPage();
                
                // 切换界面显示
                uploadZone.style.opacity = '0';
                setTimeout(() => {
                    uploadZone.style.display = 'none';
                    body.classList.add('loaded'); // 触发CSS显示主界面
                }, 500);
            },
            error: err => alert("解析错误: " + err.message)
        });
    }

    // --- 渲染页面 (核心：生成符合 index4 样式的 HTML) ---
    function renderPage() {
        const navList = document.getElementById('nav-list');
        const contentWrapper = document.getElementById('articles-wrapper');
        const pageInfo = document.getElementById('page-info');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        // 计算分页
        const totalPages = Math.ceil(allArticles.length / PAGE_SIZE);
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const start = (currentPage - 1) * PAGE_SIZE;
        const end = start + PAGE_SIZE;
        const currentData = allArticles.slice(start, end);

        // 清空
        navList.innerHTML = '';
        contentWrapper.innerHTML = '';

        // 生成内容
        currentData.forEach((row, index) => {
            const globalIndex = start + index;
            const articleId = `article-${globalIndex}`;
            
            const title = row[0] || '无标题';
            const time = row[1] || '未知时间';
            const content = row[2] || '无内容';

            // 1. 生成侧边栏链接 (使用 index4 的类名 nav-item)
            const li = document.createElement('li');
            li.className = 'nav-item';
            // 添加 active 类名逻辑（默认第一个不高亮，点击后高亮，或者可以默认高亮第一个）
            li.innerHTML = `<a href="#${articleId}" title="${title}">${globalIndex + 1}. ${title}</a>`;
            navList.appendChild(li);

            // 2. 生成文章卡片 (使用 index4 的结构 .article-wrapper)
            const div = document.createElement('div');
            div.className = 'article-wrapper'; // 关键样式类名修改
            div.id = articleId;
            div.innerHTML = `
                <h1 class="article-title">${title}</h1>
                <div class="article-meta">
                    <span>🕒 ${time}</span>
                </div>
                <div class="article-body">${content}</div>
            `;
            contentWrapper.appendChild(div);
        });

        // 更新状态
        pageInfo.innerText = `${currentPage} / ${totalPages}`;
        btnPrev.disabled = currentPage === 1;
        btnNext.disabled = currentPage === totalPages;

        // 滚动归位
        document.getElementById('main-content').scrollTop = 0;
        document.querySelector('.nav-links').scrollTop = 0;
        
        bindNavEvents();
    }

    function changePage(direction) {
        currentPage += direction;
        renderPage();
    }

    // 绑定侧边栏点击高亮
    function bindNavEvents() {
        document.querySelectorAll('.nav-item a').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                // 移除其他高亮
                document.querySelectorAll('.nav-item a').forEach(a => a.classList.remove('active'));
                // 添加当前高亮
                this.classList.add('active');
                
                // 平滑滚动
                const targetId = this.getAttribute('href').substring(1);
                const targetElement = document.getElementById(targetId);
                if(targetElement){
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
    }

    // 返回顶部逻辑
    function scrollToTop(e) {
        e.preventDefault();
        document.getElementById('main-content').scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }
</script>
</body>
</html>
